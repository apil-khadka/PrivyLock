name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build universal ad-hoc signed app
        run: |
          set -euo pipefail
          ARCHS=universal SIGNING_IDENTITY=- ./build.sh release
          lipo -info build/PrivyLock.app/Contents/MacOS/PrivyLock
          codesign --verify --deep --strict --verbose=2 build/PrivyLock.app

      - name: Create clean ZIP
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/PrivyLock-macOS.zip"
          ditto -c -k --keepParent build/PrivyLock.app "$zip_path"
          if unzip -Z1 "$zip_path" | grep -qE '(^|/)__MACOSX(/|$)'; then
            echo "ZIP contains __MACOSX" >&2
            exit 1
          fi
          if ! unzip -Z1 "$zip_path" | awk -F/ 'NF == 1 && $1 != "PrivyLock.app" && $1 != "" { exit 1 }'; then
            echo "ZIP contains an unexpected top-level entry" >&2
            exit 1
          fi
          echo "PRIVYLOCK_ZIP=$zip_path" >> "$GITHUB_ENV"

      - name: Create checksum
        run: |
          set -euo pipefail
          shasum -a 256 "$PRIVYLOCK_ZIP" | awk '{print $1}' > "$PRIVYLOCK_ZIP.sha256"
          echo "SHA256=$(cat "$PRIVYLOCK_ZIP.sha256")"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" \
            "$PRIVYLOCK_ZIP" \
            "$PRIVYLOCK_ZIP.sha256" \
            --verify-tag \
            --title "PrivyLock ${tag#v}" \
            --notes "Universal arm64 + x86_64 macOS build for macOS 12 or later. Ad-hoc signed for distribution while Apple Developer membership is unavailable; Gatekeeper may require the user to approve the first launch."
